name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py

  qa-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_required: ${{ steps.select.outputs.checks_required }}
      contracts: ${{ steps.select.outputs.contracts }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test QA contract selector
        run: ./scripts/ci/test-select-qa-contracts.sh
      - name: Select risk-based QA contracts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mode="auto"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            mode="full"
          fi
          ./scripts/ci/select-qa-contracts.sh \
            --mode "${mode}" \
            --base "${BASE_SHA:-}" \
            --head "${GITHUB_SHA}"

  go-checks:
    needs: [line-limit, qa-contracts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require source-size and selection gates
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
          SELECTION_RESULT: ${{ needs.qa-contracts.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
          test "${SELECTION_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Check formatting
        if: needs.qa-contracts.outputs.checks_required != 'false'
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - run: go vet ./...
        name: Vet
        if: needs.qa-contracts.outputs.checks_required != 'false'
      - run: go test -race ./...
        name: Race test
        if: needs.qa-contracts.outputs.checks_required != 'false'
      - name: Install pinned source-quality tools
        env:
          GOBIN: ${{ runner.temp }}/quality-bin
          CHECKS_REQUIRED: ${{ needs.qa-contracts.outputs.checks_required }}
        run: |
          if [[ "${CHECKS_REQUIRED}" != "false" ]]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "${GOBIN}" >> "${GITHUB_PATH}"
      - name: Go security scan
        if: needs.qa-contracts.outputs.checks_required != 'false'
        run: gosec -quiet ./...
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Scan current source for secrets
        run: gitleaks dir . --no-banner --redact --timeout 300

  wire-conformance:
    needs: qa-contracts
    if: needs.qa-contracts.outputs.checks_required != 'false' && contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',wire-conformance,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Prove language-neutral wire fixtures
        run: go test -run '^TestAgentWireConformanceFixtures$' ./...

  consumer-compatibility:
    needs: qa-contracts
    if: needs.qa-contracts.outputs.checks_required != 'false' && contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',consumer-compatibility,')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact protocol revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout current Hub consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: labtether/labtether
          path: _consumers/hub
          persist-credentials: false
      - name: Checkout current Go agent consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: labtether/labtether-agent
          path: _consumers/agent
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Prove Hub against exact protocol revision
        working-directory: _consumers/hub
        run: |
          go mod edit -replace "github.com/labtether/protocol=${GITHUB_WORKSPACE}"
          go test -run '^$' ./...
          go test ./internal/agentmgr
      - name: Prove Go agent against exact protocol revision
        working-directory: _consumers/agent
        run: |
          go mod edit -replace "github.com/labtether/protocol=${GITHUB_WORKSPACE}"
          go test ./...
