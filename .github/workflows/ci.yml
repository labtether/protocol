name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  qa-contracts:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.select.outputs.contracts }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test QA contract selector
        run: ./scripts/ci/test-select-qa-contracts.sh
      - name: Select risk-based QA contracts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mode="auto"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            mode="full"
          fi
          ./scripts/ci/select-qa-contracts.sh \
            --mode "${mode}" \
            --base "${BASE_SHA:-}" \
            --head "${GITHUB_SHA}"

  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - run: go vet ./...
        name: Vet
      - run: go test -race ./...
        name: Race test
      - name: Install pinned source-quality tools
        env:
          GOBIN: ${{ runner.temp }}/quality-bin
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "${GOBIN}" >> "${GITHUB_PATH}"
      - name: Go security scan
        run: gosec -quiet ./...
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Scan current source for secrets
        run: gitleaks dir . --no-banner --redact --timeout 300

  wire-conformance:
    needs: qa-contracts
    if: contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',wire-conformance,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Prove language-neutral wire fixtures
        run: go test -run '^TestAgentWireConformanceFixtures$' ./...

  consumer-compatibility:
    needs: qa-contracts
    if: contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',consumer-compatibility,')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact protocol revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout current Hub consumer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: labtether/labtether
          path: _consumers/hub
          persist-credentials: false
      - name: Checkout current Go agent consumer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: labtether/labtether-agent
          path: _consumers/agent
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Prove Hub against exact protocol revision
        working-directory: _consumers/hub
        run: |
          go mod edit -replace "github.com/labtether/protocol=${GITHUB_WORKSPACE}"
          go test -run '^$' ./...
          go test ./internal/agentmgr
      - name: Prove Go agent against exact protocol revision
        working-directory: _consumers/agent
        run: |
          go mod edit -replace "github.com/labtether/protocol=${GITHUB_WORKSPACE}"
          go test ./...
