[package]
name = "labtether-protocol"
version = "2.0.1"
edition = "2024"
description = "Wire messages the LabTether hub and its agents exchange over their WebSocket connection"
license = "Apache-2.0"
repository = "https://github.com/labtether/protocol"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
